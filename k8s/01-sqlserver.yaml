# KuboERP · SQL Server 2022 como StatefulSet con almacenamiento persistente.
# La contraseña viene del Secret "kuboerp-sql" (ver docs/despliegue/manual-despliegue.md); nunca se escribe aquí.
apiVersion: v1
kind: Service
metadata:
  name: sql
  namespace: kuboerp
  labels:
    app.kubernetes.io/name: sql
    app.kubernetes.io/part-of: kuboerp
spec:
  clusterIP: None          # servicio "headless": nombre DNS estable para el StatefulSet
  selector:
    app.kubernetes.io/name: sql
  ports:
    - name: tds
      port: 1433
      targetPort: 1433
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sql
  namespace: kuboerp
  labels:
    app.kubernetes.io/name: sql
    app.kubernetes.io/part-of: kuboerp
spec:
  serviceName: sql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sql
        app.kubernetes.io/part-of: kuboerp
    spec:
      securityContext:
        fsGroup: 10001     # usuario "mssql" de la imagen oficial
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
              name: tds
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kuboerp-sql
                  key: sa-password
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: datos
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
