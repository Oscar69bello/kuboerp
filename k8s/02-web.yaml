# KuboERP · Aplicación web ASP.NET Core: 2 réplicas detrás de un Service.
# La cadena de conexión viene del Secret "kuboerp-sql" (clave connection-string).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kuboerp
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: kuboerp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    # despliegue sin caída: primero sube la réplica nueva
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: kuboerp
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: kuboerp-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__KuboERP
              valueFrom:
                secretKeyRef:
                  name: kuboerp-sql
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:          # da hasta 2 minutos a que SQL Server esté listo en el primer arranque
            httpGet:
              path: /health/vivo
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:         # reinicia el contenedor si el proceso deja de responder
            httpGet:
              path: /health/vivo
              port: http
            periodSeconds: 15
          readinessProbe:        # solo recibe tráfico cuando hay conexión con SQL Server
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: kuboerp
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: kuboerp
spec:
  type: LoadBalancer         # en Docker Desktop queda publicado en http://localhost:8081
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8081
      targetPort: http
---
# Escalado automático entre 2 y 5 réplicas según el uso de CPU (requiere metrics-server en el clúster)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: kuboerp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
